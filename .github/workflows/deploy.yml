name: Deploy to Azure

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pyflakes
        run: python -m pyflakes app/
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: test  # G4: Gate deploy on passing tests.

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            cd ~/Oil_Spill_Detection_And_Backtracking
            git config --global --add safe.directory "*"

            echo "Fetching latest code..."
            # G4: Use deploy key (SSH) instead of token-in-URL to avoid
            # GITHUB_TOKEN exposure in process listings.
            git fetch origin main
            git reset --hard FETCH_HEAD
            git log -1 --oneline

            echo "Rebuilding API..."
            docker compose build api

            echo "Restarting API..."
            PREVIOUS=$(docker inspect --format='{{.Id}}' sih_fastapi_backend 2>/dev/null || echo "")
            docker compose up -d --force-recreate api

            echo "Waiting for API health..."
            # G4: Retry loop instead of blind sleep — fails fast if container dies.
            for i in $(seq 1 12); do
              if curl -sf http://127.0.0.1:8000/health/ready; then
                echo "API healthy after ${i}*5s"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "API failed health check. Rolling back..."
                if [ -n "$PREVIOUS" ]; then
                  docker start "$PREVIOUS" || true
                fi
                exit 1
              fi
              sleep 5
            done

            echo "Verifying vessels API..."
            curl -s http://127.0.0.1:8000/api/v1/demo/spills/spill_343abc/vessels | head -c 250
            echo ""

            echo "Deployment successful!"